name: CI Security

# Audite les workflows GitHub Actions du dépôt appelant :
#
#   actionlint : validité et correction (syntaxe, expressions, shellcheck sur
#                les blocs run, actions inexistantes)
#   zizmor     : sécurité (injection de template, déclencheurs dangereux,
#                permissions trop larges, actions non épinglées)
#
# Aucun SAST applicatif ne couvre ce périmètre : PHPStan analyse du PHP, pas le
# YAML de .github/workflows. C'est pourtant là que se logent les injections de
# script, qui s'exécutent dans le runner avec le jeton du dépôt.
#
# Les deux outils tournent toujours, puis un verdict final rassemble leurs
# résultats. Avant le 2026-09-15 ils s'enchaînaient sans filet : le moindre
# constat d'actionlint arrêtait le job, et zizmor n'était jamais atteint. Or
# c'est zizmor qui trouve les injections de template et les déclencheurs
# dangereux. L'outil qui porte le vrai risque était donc muet dès que l'autre
# avait une remarque de style.
#
# Le dépôt appelant garde le déclencheur, un workflow réutilisable ne pouvant
# pas définir son propre "on". Appel type :
#
#   on:
#     pull_request:
#       paths: ['.github/workflows/**']
#     push:
#       branches: [main, dev]
#       paths: ['.github/workflows/**']
#
#   jobs:
#     security:
#       uses: Extern-SN/github-workflows/.github/workflows/ci-security.yml@v1

on:
  workflow_call:
    inputs:
      min-severity:
        description: >
          Sévérité zizmor à partir de laquelle le job échoue.
          informational, low, medium ou high.
        type: string
        default: 'high'
      zizmor-config:
        description: >
          Fichier de configuration zizmor du dépôt appelant. S'il est absent,
          la politique par défaut de zizmor s'applique (SHA exigé partout).
        type: string
        default: 'zizmor.yml'
      actionlint-version:
        description: 'Version d''actionlint à installer'
        type: string
        default: '1.7.7'
      shellcheck-min-severity:
        description: >
          Sévérité shellcheck à partir de laquelle un constat est remonté par
          actionlint : style, info, warning ou error. Le défaut "warning" écarte
          les constats de style et d'information, qui sont souvent faux sur les
          blocs "run" : shellcheck y analyse comme du shell des scripts php, awk
          ou python passés en ligne de commande, et signale leurs variables
          comme des expansions manquantes. Les erreurs propres à actionlint
          (syntaxe, expressions, actions inexistantes) ne sont pas concernées et
          font toujours échouer l'audit.
        type: string
        default: 'warning'

permissions:
  contents: read

jobs:
  security:
    name: Audit des workflows
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Binaire officiel récupéré par version explicite plutôt que par une
      # action tierce : une dépendance de moins dans la chaîne.
      - name: Install actionlint
        env:
          VERSION: ${{ inputs.actionlint-version }}
        run: |
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
          actionlint --version

      # continue-on-error sur les deux outils : ils doivent tourner tous les deux,
      # quel que soit le résultat de l'autre. Le verdict est rendu à la fin.
      - name: Run actionlint
        id: actionlint
        continue-on-error: true
        env:
          SHELLCHECK_SEVERITY: ${{ inputs.shellcheck-min-severity }}
        run: actionlint -color -shellcheck "shellcheck -S $SHELLCHECK_SEVERITY"

      - name: Install zizmor
        run: |
          pipx install zizmor
          zizmor --version

      - name: Run zizmor
        id: zizmor
        continue-on-error: true
        env:
          SEVERITY: ${{ inputs.min-severity }}
          CONFIG: ${{ inputs.zizmor-config }}
        run: |
          args=(--no-progress --min-severity "$SEVERITY")
          if [ -f "$CONFIG" ]; then
            echo "Configuration zizmor : $CONFIG"
            args+=(--config "$CONFIG")
          else
            echo "Aucune configuration zizmor, politique par défaut (SHA exigé partout)"
          fi
          zizmor "${args[@]}" .github/workflows/

      # Verdict unique, après les deux outils. Les résultats passent par env :
      # une interpolation directe dans un bloc "run" est le motif d'injection de
      # template que ce workflow a précisément pour rôle de détecter ailleurs.
      - name: Verdict
        if: always()
        env:
          ACTIONLINT: ${{ steps.actionlint.outcome }}
          ZIZMOR: ${{ steps.zizmor.outcome }}
        run: |
          echo "actionlint : $ACTIONLINT"
          echo "zizmor     : $ZIZMOR"

          rc=0
          if [ "$ACTIONLINT" != "success" ]; then
            echo "::error title=actionlint::Constats relevés, voir l'étape Run actionlint."
            rc=1
          fi
          if [ "$ZIZMOR" != "success" ]; then
            echo "::error title=zizmor::Constats relevés, voir l'étape Run zizmor."
            rc=1
          fi
          exit "$rc"
