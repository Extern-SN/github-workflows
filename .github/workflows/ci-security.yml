name: CI Security

# Audite les workflows GitHub Actions du dépôt appelant :
#
#   actionlint : validité et correction (syntaxe, expressions, shellcheck sur
#                les blocs run, actions inexistantes)
#   zizmor     : sécurité (injection de template, déclencheurs dangereux,
#                permissions trop larges, actions non épinglées)
#
# Aucun SAST applicatif ne couvre ce périmètre : PHPStan analyse du PHP, pas le
# YAML de .github/workflows. C'est pourtant là que se logent les injections de
# script, qui s'exécutent dans le runner avec le jeton du dépôt.
#
# Les deux outils tournent toujours, puis un verdict final rassemble leurs
# résultats. Avant le 2026-09-15 ils s'enchaînaient sans filet : le moindre
# constat d'actionlint arrêtait le job, et zizmor n'était jamais atteint. Or
# c'est zizmor qui trouve les injections de template et les déclencheurs
# dangereux. L'outil qui porte le vrai risque était donc muet dès que l'autre
# avait une remarque de style.
#
# Le dépôt appelant garde le déclencheur, un workflow réutilisable ne pouvant
# pas définir son propre "on". Appel type :
#
#   on:
#     pull_request:
#       paths: ['.github/workflows/**']
#     push:
#       branches: [main, dev]
#       paths: ['.github/workflows/**']
#
#   jobs:
#     security:
#       uses: Extern-SN/github-workflows/.github/workflows/ci-security.yml@v1

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Labels du runner au format JSON, par exemple ["self-hosted","linux"],
          ou une chaîne JSON pour un runner unique : "ubuntu-22.04".
          Le défaut cible le runner self-hosted du Groupe : le quota GitHub
          Actions de l'organisation est épuisé, et les dépôts appelants
          basculent sans rien modifier chez eux. Passer '"ubuntu-22.04"'
          (guillemets simples ET doubles) pour forcer un runner GitHub-hosted.
        type: string
        required: false
        default: '["self-hosted","Linux","X64","ovh-ppr"]'
      min-severity:
        description: >
          Sévérité zizmor à partir de laquelle le job échoue.
          informational, low, medium ou high.
        type: string
        default: 'high'
      zizmor-config:
        description: >
          Fichier de configuration zizmor du dépôt appelant. S'il est absent,
          la politique par défaut de zizmor s'applique (SHA exigé partout).
        type: string
        default: 'zizmor.yml'
      actionlint-version:
        description: 'Version d''actionlint à installer'
        type: string
        default: '1.7.7'
      shellcheck-min-severity:
        description: >
          Sévérité shellcheck à partir de laquelle un constat est remonté par
          actionlint : style, info, warning ou error. Le défaut "warning" écarte
          les constats de style et d'information, qui sont souvent faux sur les
          blocs "run" : shellcheck y analyse comme du shell des scripts php, awk
          ou python passés en ligne de commande, et signale leurs variables
          comme des expansions manquantes. Les erreurs propres à actionlint
          (syntaxe, expressions, actions inexistantes) ne sont pas concernées et
          font toujours échouer l'audit.
        type: string
        default: 'warning'

permissions:
  contents: read

jobs:
  security:
    name: Audit des workflows
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Outils attendus sur le runner. Un runner self-hosted n'est pas une
      # image GitHub-hosted : rien n'y est garanti préinstallé, et le job n'a
      # pas le droit d'installer quoi que ce soit au niveau système (aucun
      # "sudo apt-get" ici, un runner partagé ne se modifie pas depuis un job).
      # Mieux vaut un message explicite qu'un "command not found" à l'étape
      # suivante.
      - name: Vérifie les outils attendus
        run: |
          manquants=""
          for outil in curl tar shellcheck python3; do
            command -v "$outil" >/dev/null 2>&1 || manquants="$manquants $outil"
          done
          if [ -n "$manquants" ]; then
            echo "::error title=Outils manquants sur le runner::Absents :$manquants. Les installer sur le runner self-hosted, ou appeler ce workflow avec runner: '\"ubuntu-22.04\"'."
            exit 1
          fi
          echo "Outils présents : curl, tar, shellcheck, python3."

      # Binaire officiel récupéré par version explicite plutôt que par une
      # action tierce : une dépendance de moins dans la chaîne.
      #
      # Installé dans $RUNNER_TEMP, pas dans /usr/local/bin : l'ancien "sudo mv"
      # supposait le droit root, que les runners GitHub-hosted accordent et
      # qu'un runner self-hosted n'a aucune raison de donner à un job. Le
      # dossier est ajouté au PATH par $GITHUB_PATH, et $RUNNER_TEMP étant
      # propre à chaque job, deux runs concurrents sur la même machine ne se
      # marchent pas dessus.
      - name: Install actionlint
        env:
          VERSION: ${{ inputs.actionlint-version }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLo "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/actionlint" --version

      # continue-on-error sur les deux outils : ils doivent tourner tous les deux,
      # quel que soit le résultat de l'autre. Le verdict est rendu à la fin.
      - name: Run actionlint
        id: actionlint
        continue-on-error: true
        env:
          SHELLCHECK_SEVERITY: ${{ inputs.shellcheck-min-severity }}
        run: actionlint -color -shellcheck "shellcheck -S $SHELLCHECK_SEVERITY"

      # pipx s'il est là, sinon "pip install --user", qui n'exige pas plus de
      # droits : l'ancien "pipx install" sec supposait pipx préinstallé, ce que
      # seules les images GitHub-hosted garantissent. Le dossier des binaires
      # utilisateur n'est pas toujours dans le PATH d'un runner self-hosted :
      # on l'y ajoute explicitement.
      - name: Install zizmor
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install zizmor
            pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH" 2>/dev/null \
              || echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          elif command -v pip3 >/dev/null 2>&1 || python3 -m pip --version >/dev/null 2>&1; then
            python3 -m pip install --user --upgrade zizmor
            echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          else
            echo "::error title=pip absent::Ni pipx ni pip ne sont disponibles sur le runner. Installer python3-pip sur le runner self-hosted, ou appeler ce workflow avec runner: '\"ubuntu-22.04\"'."
            exit 1
          fi
          # $GITHUB_PATH ne prend effet qu'à l'étape suivante : pour appeler
          # zizmor ici même, on étend le PATH de ce shell. Déclaration et
          # affectation séparées (shellcheck SC2155).
          user_base=$(python3 -m site --user-base 2>/dev/null || echo "$HOME/.local")
          export PATH="$user_base/bin:$HOME/.local/bin:$PATH"
          zizmor --version

      - name: Run zizmor
        id: zizmor
        continue-on-error: true
        env:
          SEVERITY: ${{ inputs.min-severity }}
          CONFIG: ${{ inputs.zizmor-config }}
        run: |
          args=(--no-progress --min-severity "$SEVERITY")
          if [ -f "$CONFIG" ]; then
            echo "Configuration zizmor : $CONFIG"
            args+=(--config "$CONFIG")
          else
            echo "Aucune configuration zizmor, politique par défaut (SHA exigé partout)"
          fi
          zizmor "${args[@]}" .github/workflows/

      # Verdict unique, après les deux outils. Les résultats passent par env :
      # une interpolation directe dans un bloc "run" est le motif d'injection de
      # template que ce workflow a précisément pour rôle de détecter ailleurs.
      - name: Verdict
        if: always()
        env:
          ACTIONLINT: ${{ steps.actionlint.outcome }}
          ZIZMOR: ${{ steps.zizmor.outcome }}
        run: |
          echo "actionlint : $ACTIONLINT"
          echo "zizmor     : $ZIZMOR"

          rc=0
          if [ "$ACTIONLINT" != "success" ]; then
            echo "::error title=actionlint::Constats relevés, voir l'étape Run actionlint."
            rc=1
          fi
          if [ "$ZIZMOR" != "success" ]; then
            echo "::error title=zizmor::Constats relevés, voir l'étape Run zizmor."
            rc=1
          fi
          exit "$rc"
