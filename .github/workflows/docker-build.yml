name: Docker Build & Push

on:
  workflow_call:
    inputs:
      registry:
        description: 'Container registry (docker.io, ghcr.io, ...)'
        type: string
        required: true
      image-name:
        description: 'Image name without registry prefix (ex: myorg/myapp)'
        type: string
        required: true
      dockerfile:
        type: string
        default: 'Dockerfile'
      context:
        type: string
        default: '.'
      push:
        description: 'Push image to registry after build and tests'
        type: boolean
        default: true
      with-trivy:
        description: 'Run Trivy CVE scan before push'
        type: boolean
        default: true
      notify-on-failure:
        description: 'Send a generic webhook notification if the workflow fails'
        type: boolean
        default: false
      trivy-ignore-file:
        type: string
        default: '.trivyignore'
      smoke-test-script:
        description: 'Path to smoke test script in the repo (skipped if file absent)'
        type: string
        default: 'scripts/ci-smoke-test.sh'
      build-args:
        description: 'Build arguments passed to docker build (multiline key=value)'
        type: string
        default: ''
      with-sha-tag:
        description: 'Also push a tag with the short commit SHA (désactivé par défaut : encombre le registre sans usage identifié)'
        type: boolean
        default: false
    secrets:
      registry-username:
        required: true
      registry-token:
        required: true
      failure-notification-webhook:
        required: false

jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=sha,prefix=,format=short,enable=${{ inputs.with-sha-tag }}

      - name: Login to registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-token }}

      # load:true et attestations (provenance/sbom) sont incompatibles : les attestations
      # créent un manifest list que le daemon Docker local ne supporte pas.
      # On build donc en deux étapes : local sans attestations, puis push avec attestations depuis le cache GHA.
      - name: Build local (smoke test + Trivy)
        id: build-local
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: local-ci:latest
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          CI_IMAGE: local-ci:latest
        run: |
          if [ -f "${{ inputs.smoke-test-script }}" ]; then
            bash "${{ inputs.smoke-test-script }}"
          fi

      - name: Scan CVE (Trivy)
        if: inputs.with-trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-ci:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: ${{ inputs.trivy-ignore-file }}

      - name: Push with attestations
        if: inputs.push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha

      - name: Notify failure webhook
        if: ${{ failure() && inputs['notify-on-failure'] }}
        env:
          NOTIFICATION_WEBHOOK: ${{ secrets.failure-notification-webhook }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          [ -z "$NOTIFICATION_WEBHOOK" ] && exit 0
          curl -fsSL -X POST "$NOTIFICATION_WEBHOOK" \
            -H 'Content-Type: application/json' \
            --data @- <<EOF
          {
            "status": "failure",
            "repository": "$REPOSITORY",
            "ref": "$REF_NAME",
            "workflow": "$WORKFLOW_NAME",
            "run_url": "$RUN_URL",
            "message": "Docker build workflow failed for $REPOSITORY on $REF_NAME"
          }
          EOF
