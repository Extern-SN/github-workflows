name: Docker Build & Push

on:
  workflow_call:
    inputs:
      registry:
        description: 'Container registry (docker.io, ghcr.io, ...)'
        type: string
        required: true
      image-name:
        description: 'Image name without registry prefix (ex: myorg/myapp)'
        type: string
        required: true
      dockerfile:
        type: string
        default: 'Dockerfile'
      context:
        type: string
        default: '.'
      push:
        description: 'Push image to registry after build and tests'
        type: boolean
        default: true
      with-trivy:
        description: 'Run Trivy CVE scan before push'
        type: boolean
        default: true
      notify-on-failure:
        description: 'Send a generic webhook notification if the workflow fails'
        type: boolean
        default: false
      trivy-ignore-file:
        type: string
        default: '.trivyignore'
      free-disk-space:
        description: >
          Libere l'espace disque du runner avant le build. A activer pour une
          image volumineuse : Trivy exporte l'image entiere dans /tmp pour
          l'analyser, et un runner GitHub n'a qu'une quinzaine de gigaoctets
          libres. Coute environ une minute, donc desactive par defaut.
        type: boolean
        default: false
      smoke-test-script:
        description: 'Path to smoke test script in the repo (skipped if file absent)'
        type: string
        default: 'scripts/ci-smoke-test.sh'
      build-args:
        description: 'Build arguments passed to docker build (multiline key=value)'
        type: string
        default: ''
      with-sha-tag:
        description: 'Also push a tag with the short commit SHA (désactivé par défaut : encombre le registre sans usage identifié)'
        type: boolean
        default: false
    secrets:
      registry-username:
        required: true
      registry-token:
        required: true
      failure-notification-webhook:
        required: false

jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Trivy exporte l'image entiere dans /tmp avant de l'analyser. Sur une
      # image volumineuse, le scan echoue sur "no space left on device" apres
      # plusieurs minutes, et l'echec ne ressemble en rien a un probleme de
      # place : il se presente comme "failed to analyze layer".
      # Constate le 2026-09-17 sur ExternIT-repo/arbs-odoo, image Odoo 18.
      - name: Free disk space
        if: inputs.free-disk-space
        run: |
          echo "Avant :"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          echo "Apres :"; df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=sha,prefix=,format=short,enable=${{ inputs.with-sha-tag }}

      - name: Login to registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-token }}

      # load:true et attestations (provenance/sbom) sont incompatibles : les attestations
      # créent un manifest list que le daemon Docker local ne supporte pas.
      # On build donc en deux étapes : local sans attestations, puis push avec attestations depuis le cache GHA.
      - name: Build local (smoke test + Trivy)
        id: build-local
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          pull: true
          tags: local-ci:latest
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          CI_IMAGE: local-ci:latest
          # Le chemin passe par l'environnement plutot que par interpolation :
          # une expression developpee dans le texte du script peut en sortir et
          # executer autre chose que ce qu'elle designe.
          SMOKE_TEST_SCRIPT: ${{ inputs.smoke-test-script }}
        run: |
          if [ -f "$SMOKE_TEST_SCRIPT" ]; then
            bash "$SMOKE_TEST_SCRIPT"
          fi

      # La base Trivy (~100 Mo) est retéléchargée à chaque run sans ce cache,
      # faute de quoi TRIVY_CACHE_DIR (par défaut sous le workspace, jamais
      # persisté entre deux runs) repart de zéro à chaque fois. Clé datée
      # (la base se met à jour environ toutes les 6h côté Trivy) avec repli
      # sur le cache le plus récent disponible si la clé du jour est absente.
      - name: Compute date for Trivy DB cache key
        if: inputs.with-trivy
        id: trivy-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DB
        if: inputs.with-trivy
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-db-

      # Épinglé sur une release (pas @master) : une version non testée de l'action
      # ne doit pas pouvoir casser les builds de tous les dépôts consommateurs.
      - name: Scan CVE (Trivy)
        if: inputs.with-trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          # Authentifie le téléchargement de la base Trivy (ghcr.io) pour
          # éviter la limite de taux anonyme, partagée entre tous les jobs
          # sur les IP des runners GitHub-hosted (surtout utile en cache froid,
          # le cache actions/cache ci-dessus couvrant le cas courant).
          GITHUB_TOKEN: ${{ github.token }}
        with:
          image-ref: local-ci:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # trivy-action echoue ("cannot find ignorefile") quand le fichier passe
          # ici n'existe pas, AVANT d'avoir scanne quoi que ce soit. Le defaut de
          # l'entree etant .trivyignore, tout depot qui adopte la chaine sans ce
          # fichier voit son scan CVE rougir sans qu'aucune CVE ait ete cherchee :
          # le controle qui justifie ce job ne tourne jamais, et l'echec ressemble
          # a une trouvaille. Le fichier n'est donc passe que s'il existe.
          trivyignores: ${{ inputs.trivy-ignore-file != '' && hashFiles(inputs.trivy-ignore-file) != '' && inputs.trivy-ignore-file || '' }}
          cache-dir: ~/.cache/trivy
          # Ce job ne veut que le scan CVE (with-trivy) : sans ce réglage, Trivy scanne
          # aussi secrets et mauvaises configurations par défaut, plus lent et hors
          # périmètre de cette étape (amendement 2026-08-06).
          scanners: vuln

      - name: Push with attestations
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha

      - name: Notify failure webhook
        if: ${{ failure() && inputs['notify-on-failure'] }}
        env:
          NOTIFICATION_WEBHOOK: ${{ secrets.failure-notification-webhook }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          [ -z "$NOTIFICATION_WEBHOOK" ] && exit 0
          curl -fsSL -X POST "$NOTIFICATION_WEBHOOK" \
            -H 'Content-Type: application/json' \
            --data @- <<EOF
          {
            "status": "failure",
            "repository": "$REPOSITORY",
            "ref": "$REF_NAME",
            "workflow": "$WORKFLOW_NAME",
            "run_url": "$RUN_URL",
            "message": "Docker build workflow failed for $REPOSITORY on $REF_NAME"
          }
          EOF
