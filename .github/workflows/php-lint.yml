name: PHP Lint

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        required: true
      extensions:
        description: 'PHP extensions to install (comma-separated)'
        type: string
        default: 'mbstring, intl, xml, dom, curl, zip'
      install-command:
        type: string
        default: 'composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader'
      lint-command:
        description: 'Static analysis command. Le périmètre analysé se règle dans le fichier de config du projet (ex: phpstan.neon > paths), pas ici.'
        type: string
        default: 'vendor/bin/phpstan analyse --no-progress'

jobs:
  lint:
    name: Analyse statique
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false  # aucun push : le jeton n'a rien à faire dans le checkout

      - name: Setup PHP ${{ inputs.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: $(composer config cache-files-dir)
          key: composer-lint-php${{ inputs.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-lint-php${{ inputs.php-version }}-

      - name: Install dependencies
        env:
          # La commande passe par l'environnement plutot que par interpolation.
          # Elle reste executee telle quelle, c'est sa raison d'etre : cette entree
          # n'est ecrite que dans un fichier commite du depot appelant, donc son
          # exploitation suppose deja un acces en ecriture. Ce que env: ferme, c'est
          # la sortie du contexte de citation lors du developpement de l'expression.
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -c "$INSTALL_COMMAND"

      - name: Run static analysis
        env:
          # La commande passe par l'environnement plutot que par interpolation.
          # Elle reste executee telle quelle, c'est sa raison d'etre : cette entree
          # n'est ecrite que dans un fichier commite du depot appelant, donc son
          # exploitation suppose deja un acces en ecriture. Ce que env: ferme, c'est
          # la sortie du contexte de citation lors du developpement de l'expression.
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: bash -c "$LINT_COMMAND"
