name: Validate PR

# Vérifie que chaque PR respecte les conventions du Groupe avant de pouvoir
# être mergée : nommage de la branche source, et présence d'exactement un
# label de release (qui détermine l'incrément de version au merge).
#
# Le dépôt appelant garde le déclencheur, un workflow réutilisable ne pouvant
# pas définir son propre "on". Appel type :
#
#   on:
#     pull_request:
#       branches: [dev, main]
#       types: [opened, edited, synchronize, labeled, unlabeled]
#
#   jobs:
#     validate:
#       uses: Extern-SN/github-workflows/.github/workflows/validate-pr.yml@v1
#
# Ce workflow ne demande que des droits de LECTURE, et c'est une contrainte, pas
# une précaution : GitHub valide les permissions des jobs imbriqués à la création
# du run, avant d'évaluer le moindre "if". Un job optionnel exigeant
# "pull-requests: write" imposerait donc l'écriture à TOUS les appelants, même
# ceux qui ne s'en servent pas, et ferait échouer les autres au démarrage, sans
# job ni log exploitable. Constaté le 2026-09-18, corrigé en séparant.
#
# Pour poser le label avant de le contrôler, dans un ordre déterministe, appeler
# validate-pr-labelled.yml, qui compose les deux et porte l'écriture.

on:
  workflow_call:
    inputs:
      enforce-naming-on-base:
        description: >
          Branche de base sur laquelle la règle de nommage s'applique.
          "dev" (défaut) laisse libres les PR d'intégration dev vers main.
          "*" applique la règle à toutes les PR.
        type: string
        default: 'dev'
      branch-pattern:
        description: 'Expression régulière que doit respecter la branche source'
        type: string
        default: '^(feature|fix|hotfix)/.+$'
      enforce-naming-on-bots:
        description: >
          Applique la règle de nommage aux PR ouvertes par un automate
          (Dependabot, Renovate). Ces outils nomment leurs branches eux-mêmes,
          sans possibilité de configuration : "dependabot/github_actions/...".
          La règle ne leur apprend donc rien, elle rend seulement rouge toute PR
          de mise à jour de dépendance. Passer "true" pour l'exiger quand même.
        type: boolean
        default: false
      changelog-file:
        description: >
          Changelog au format Keep a Changelog. S'il est renseigné, la PR doit
          porter elle-même la section de la version que son merge publiera, par
          exemple "## [v1.6.0]". Le contrôle dit laquelle si elle manque.

          C'est ce qui permet à release-tag.yml de ne plus rien pousser sur la
          branche par défaut au merge : il trouve la section déjà écrite et se
          contente de taguer et publier. Laisser vide conserve le comportement
          d'origine, où la section "Non publié" est promue au merge.
        type: string
        default: ''
      labels:
        description: 'Labels de release acceptés, un par ligne'
        type: string
        default: |
          feature
          fix
          hotfix
          chore
          breaking

permissions:
  contents: read

jobs:
  validate:
    name: Conventions de PR
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read  # lecture des labels de la PR

    steps:
      # Vérifie que le nom de la branche source suit la convention :
      #   feature/* → nouvelle fonctionnalité
      #   fix/*     → correction de bug
      #   hotfix/*  → correction urgente
      #
      # Les références et le motif sont passés par l'environnement et jamais
      # interpolés dans le texte du script : un nom de branche construit pour
      # cela ne peut pas s'exécuter dans le runner (injection de script,
      # OpenSSF Dangerous-Workflow).
      #
      # Les PR d'automates sont hors de cette règle par défaut : Dependabot et
      # Renovate nomment leurs branches eux-mêmes et ne se configurent pas sur ce
      # point. Comme le kit SDU pose "dependabot.yml" en même temps que ce
      # contrôle, toute PR de mise à jour de dépendance partait rouge pour un
      # nom que personne ne peut changer (constaté le 2026-09-18 sur les trois
      # premières PR Dependabot du dépôt socle). Le type d'auteur vient de
      # l'événement GitHub et ne peut pas être usurpé par un contributeur.
      - name: Validate branch naming
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          ENFORCE_ON: ${{ inputs.enforce-naming-on-base }}
          PATTERN: ${{ inputs.branch-pattern }}
          AUTEUR_BOT: ${{ github.event.pull_request.user.type == 'Bot' }}
          ENFORCE_ON_BOTS: ${{ inputs.enforce-naming-on-bots }}
        run: |
          echo "Branch: $BRANCH"
          echo "Base: $BASE"

          if [ "$AUTEUR_BOT" = "true" ] && [ "$ENFORCE_ON_BOTS" != "true" ]; then
            echo "PR ouverte par un automate : règle de nommage non applicable."
            echo "Le label de release reste exigé."
            exit 0
          fi

          if [ "$ENFORCE_ON" != "*" ] && [ "$BASE" != "$ENFORCE_ON" ]; then
            echo "Règle de nommage non applicable aux PR vers \"$BASE\"."
            exit 0
          fi

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "Invalid branch naming."
            echo "Expected pattern: $PATTERN"
            exit 1
          fi

          echo "Nommage conforme."

      # Vérifie qu'exactement 1 label de release est posé sur la PR.
      # Ce label détermine quel chiffre de la version sera incrémenté au merge :
      #   feature  → bump mineur (1.X.0)
      #   fix / hotfix / chore → bump patch (1.0.X)
      #   breaking → bump majeur (X.0.0)
      # Le changelog doit porter la section de la version que ce merge publiera.
      #
      # La règle d'incrément est la même que celle de release-tag.yml, et les deux
      # doivent le rester : c'est release-tag qui calculera le numéro au merge, et
      # une divergence ferait échouer la publication sur une section introuvable.
      - name: Checkout repository
        if: inputs.changelog-file != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # l'historique complet des tags
          persist-credentials: false  # aucun push : contrôle en lecture seule

      - name: Validate changelog section
        if: inputs.changelog-file != ''
        env:
          CHANGELOG: ${{ inputs.changelog-file }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DEPOT: ${{ github.repository }}
        run: |
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error title=Changelog absent::$CHANGELOG n'existe pas dans le dépôt."
            exit 1
          fi

          LAST_TAG=$(git tag --sort=-v:refname | grep '^v' | head -n 1)
          LABELS=$(gh api "repos/$DEPOT/pulls/$PR" -q '.labels[].name')

          if [ -z "$LAST_TAG" ]; then
            NEXT_TAG="v1.0.0"
          else
            VERSION="${LAST_TAG#v}"
            IFS='.' read -r X Y Z <<< "$VERSION"
            if echo "$LABELS" | grep -q "^breaking$"; then
              X=$((X + 1)); Y=0; Z=0
            elif echo "$LABELS" | grep -q "^feature$"; then
              Y=$((Y + 1)); Z=0
            else
              Z=$((Z + 1))
            fi
            NEXT_TAG="v${X}.${Y}.${Z}"
          fi

          echo "Dernier tag : ${LAST_TAG:-aucun}"
          echo "Version que ce merge publiera : $NEXT_TAG"

          if ! grep -q "^## \[$NEXT_TAG\]" "$CHANGELOG"; then
            echo "::error title=Section de changelog manquante::Ajoutez dans $CHANGELOG une section \"## [$NEXT_TAG] - $(date -u +%Y-%m-%d)\" décrivant ce que cette PR publie. Le merge taguera $NEXT_TAG et la release reprendra cette section."
            exit 1
          fi

          CORPS=$(awk -v tag="## [$NEXT_TAG]" '
            index($0, tag) == 1 { flag = 1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' "$CHANGELOG")

          if ! grep -q '[^[:space:]]' <<< "$CORPS"; then
            echo "::error title=Section de changelog vide::La section $NEXT_TAG de $CHANGELOG n'a aucun contenu."
            exit 1
          fi

          echo "Section $NEXT_TAG présente et renseignée."

      - name: Validate labels
        # Épinglé par SHA (v5.6.0) : un tag mobile peut être redirigé vers du code
        # hostile, qui s'exécuterait ici avec le jeton du dépôt appelant.
        uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
        with:
          mode: exactly
          count: 1
          labels: ${{ inputs.labels }}
