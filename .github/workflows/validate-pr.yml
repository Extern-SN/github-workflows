name: Validate PR

# Vérifie que chaque PR respecte les conventions du Groupe avant de pouvoir
# être mergée : nommage de la branche source, et présence d'exactement un
# label de release (qui détermine l'incrément de version au merge).
#
# Le dépôt appelant garde le déclencheur, un workflow réutilisable ne pouvant
# pas définir son propre "on". Appel type :
#
#   on:
#     pull_request:
#       branches: [dev, main]
#       types: [opened, edited, synchronize, labeled, unlabeled]
#
# Le job attend au plus 60 s qu'un label de version apparaisse avant de trancher,
# parce qu'auto-label.yml court en parallèle dans un workflow distinct.
#
#   jobs:
#     validate:
#       uses: Extern-SN/github-workflows/.github/workflows/validate-pr.yml@v1

on:
  workflow_call:
    inputs:
      enforce-naming-on-base:
        description: >
          Branche de base sur laquelle la règle de nommage s'applique.
          "dev" (défaut) laisse libres les PR d'intégration dev vers main.
          "*" applique la règle à toutes les PR.
        type: string
        default: 'dev'
      branch-pattern:
        description: 'Expression régulière que doit respecter la branche source'
        type: string
        default: '^(feature|fix|hotfix)/.+$'
      labels:
        description: 'Labels de release acceptés, un par ligne'
        type: string
        default: |
          feature
          fix
          hotfix
          chore
          breaking

permissions:
  contents: read

jobs:
  validate:
    name: Conventions de PR
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read  # lecture des labels de la PR

    steps:
      # Vérifie que le nom de la branche source suit la convention :
      #   feature/* → nouvelle fonctionnalité
      #   fix/*     → correction de bug
      #   hotfix/*  → correction urgente
      #
      # Les références et le motif sont passés par l'environnement et jamais
      # interpolés dans le texte du script : un nom de branche construit pour
      # cela ne peut pas s'exécuter dans le runner (injection de script,
      # OpenSSF Dangerous-Workflow).
      - name: Validate branch naming
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          ENFORCE_ON: ${{ inputs.enforce-naming-on-base }}
          PATTERN: ${{ inputs.branch-pattern }}
        run: |
          echo "Branch: $BRANCH"
          echo "Base: $BASE"

          if [ "$ENFORCE_ON" != "*" ] && [ "$BASE" != "$ENFORCE_ON" ]; then
            echo "Règle de nommage non applicable aux PR vers \"$BASE\"."
            exit 0
          fi

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "Invalid branch naming."
            echo "Expected pattern: $PATTERN"
            exit 1
          fi

          echo "Nommage conforme."

      # auto-label.yml tourne dans un workflow distinct, déclenché par le même
      # événement : les deux courent en parallèle et rien ne garantit l'ordre. Le
      # label peut donc arriver après ce contrôle, qui échoue alors sur une PR
      # parfaitement conforme. Le type "labeled" ne rattrape pas le coup : le
      # label est posé avec GITHUB_TOKEN, et un événement émis avec ce jeton ne
      # déclenche aucun workflow. Un rouge injustifié apprend à ignorer ce
      # contrôle, et c'est ainsi qu'une PR réellement sans label passe.
      #
      # On attend donc brièvement, et seulement tant qu'aucun label n'est là.
      # Cette étape ne tranche rien : elle ne fait jamais échouer le job.
      - name: Attend la pose du label de release
        uses: actions/github-script@v9
        env:
          LABELS: ${{ inputs.labels }}
        with:
          script: |
            const attendus = process.env.LABELS
              .split(/[\n,]/).map(s => s.trim()).filter(Boolean);

            const lire = async () => {
              const poses = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                per_page: 100,
              });
              return poses.map(l => l.name).filter(n => attendus.includes(n));
            };

            const essais = 12;      // 12 x 5 s = 60 s au plus
            for (let i = 1; i <= essais; i++) {
              const trouves = await lire();
              if (trouves.length > 0) {
                console.log(`Label de version présent (${trouves.join(', ')}) après ${(i - 1) * 5} s.`);
                return;
              }
              if (i < essais) await new Promise(r => setTimeout(r, 5000));
            }
            console.log(
              `Aucun label de version après ${essais * 5} s. Le contrôle suivant tranchera.`
            );

      # Vérifie qu'exactement 1 label de release est posé sur la PR.
      # Ce label détermine quel chiffre de la version sera incrémenté au merge :
      #   feature  → bump mineur (1.X.0)
      #   fix / hotfix / chore → bump patch (1.0.X)
      #   breaking → bump majeur (X.0.0)
      - name: Validate labels
        # Épinglé par SHA (v5.6.0) : un tag mobile peut être redirigé vers du code
        # hostile, qui s'exécuterait ici avec le jeton du dépôt appelant.
        uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
        with:
          mode: exactly
          count: 1
          labels: ${{ inputs.labels }}
