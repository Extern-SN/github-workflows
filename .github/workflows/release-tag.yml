name: Release Tag

# Crée automatiquement un tag Git SemVer (vX.Y.Z) à chaque merge sur main.
# Le chiffre incrémenté dépend du label posé sur la PR mergée :
#
#   breaking → majeur : X+1.0.0  (changement incompatible avec la version précédente)
#   feature  → mineur : X.Y+1.0  (nouvelle fonctionnalité)
#   fix / hotfix / chore → patch : X.Y.Z+1
#
# S'il n'existe aucun tag, le premier est toujours v1.0.0 : le label de la PR
# qui déclenche ce premier tag n'incrémente rien (bug corrigé le 2026-08-27 —
# la version copiée-collée par repo avant mutualisation appliquait toujours
# l'incrément du label, y compris sur le tout premier tag, produisant v1.0.1/
# v1.1.0/v2.0.0 selon le label au lieu de v1.0.0).
#
# Le tag créé déclenche ensuite le workflow de build de l'image Docker du
# dépôt appelant (workflow_dispatch sur docker-workflow-file).
#
# Deux garde-fous, ajoutés le 2026-09-15 après deux releases erronées :
#
#   - une PR sans label de version fait échouer le workflow, au lieu d'être
#     traitée comme un correctif. Un numéro de version publié doit résulter
#     d'une décision, jamais d'un repli silencieux ;
#   - une section de changelog promue sans contenu fait échouer le workflow
#     avant tout commit, tag ou release, au lieu de publier une version vide.
#
# Les deux échecs sont rattrapables sans rien défaire : corriger la cause sur
# la PR ou le changelog, puis relancer le run.

on:
  workflow_call:
    inputs:
      docker-workflow-file:
        description: 'Fichier du workflow à déclencher via workflow_dispatch après la création du tag'
        type: string
        default: 'docker-build.yml'
      changelog-file:
        description: >
          Fichier de changelog au format Keep a Changelog. S'il est renseigné et
          présent dans le dépôt, sa section "Non publié" est promue en version
          datée avant la création du tag, et son contenu sert de corps à la
          GitHub Release. Laisser vide pour désactiver (comportement d'origine).
        type: string
        default: ''
      create-release:
        description: >
          Publie une GitHub Release sur le tag créé. Le corps reprend la section
          promue du changelog, ou les notes générées par GitHub à défaut.
        type: boolean
        default: false
      sync-branch:
        description: >
          Branche de développement vers laquelle reporter le commit de promotion
          du changelog, après la création du tag. Sans ce report, la branche de
          développement conserve en section "Non publié" des entrées déjà
          publiées, et la release suivante les republie sous un nouveau numéro.
          Laisser vide pour désactiver.
        type: string
        default: ''

# Moindre privilège : lecture seule par défaut, les écritures ne sont accordées
# qu'au job qui en a besoin. Un "write" déclaré au niveau du workflow est
# pénalisé par OpenSSF Scorecard (Token-Permissions) même s'il ne sert qu'à un job.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write       # pour créer et pousser le tag Git et le commit de changelog
      pull-requests: read   # pour lire les labels de la PR mergée
      actions: write        # pour déclencher docker-workflow-file via workflow_dispatch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # nécessaire pour accéder à l'historique complet des tags

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # Récupère le numéro de la PR qui vient d'être mergée en cherchant
      # le SHA du commit dans la liste des PRs mergées sur main.
      # Puis lit les labels posés sur cette PR.
      - name: Get merged PR labels
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --state merged \
            --base main \
            --search "${{ github.sha }}" \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "No merged PR found"
            exit 1
          fi

          echo "PR_NUMBER=$PR_NUMBER"

          LABELS=$(gh pr view "$PR_NUMBER" \
            --json labels \
            --jq '.labels[].name')

          # Une PR sans label de version est une décision de version qui n'a pas
          # été prise. Sans ce contrôle, le calcul ci-dessous la traite comme un
          # "chore" et publie un correctif : le numéro publié devient alors le
          # résultat d'un repli silencieux, pas d'un choix. Constaté sur deux
          # releases consécutives le 2026-09-15, dont une qui ajoutait un
          # contrôle de sécurité et méritait un incrément mineur.
          #
          # L'échec est rattrapable : poser le label sur la PR mergée, puis
          # relancer ce run. Rien n'a encore été commité, tagué ni publié.
          if ! echo "$LABELS" | grep -qE '^(breaking|feature|fix|hotfix|chore)$'; then
            echo "::error title=Label de version manquant::La PR #$PR_NUMBER ne porte aucun label de version. Attendu exactement un parmi breaking, feature, fix, hotfix, chore. Posez-le sur la PR puis relancez ce workflow."
            echo "Labels trouvés : ${LABELS:-aucun}"
            exit 1
          fi

          echo "labels<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LABELS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Calcule le prochain tag en fonction du dernier tag existant et du label de la PR.
      # Si aucun tag n'existe encore, le premier tag est toujours v1.0.0 : le label ne
      # s'applique qu'à partir du deuxième tag.
      # Règle de priorité au-delà du premier tag : breaking > feature > patch (fix/hotfix/chore)
      - name: Calculate next version
        id: version
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep '^v' | head -n 1)

          echo "Last tag: $LAST_TAG"
          echo "Labels:"
          echo "$LABELS"

          if [ -z "$LAST_TAG" ]; then
            NEXT_TAG="v1.0.0"
          else
            VERSION="${LAST_TAG#v}"
            IFS='.' read -r X Y Z <<< "$VERSION"

            # "breaking" : changement incompatible — on incrémente le chiffre majeur
            # et on remet mineur + patch à zéro pour repartir d'une base propre.
            if echo "$LABELS" | grep -q "^breaking$"; then
              X=$((X + 1)); Y=0; Z=0

            # "feature" : nouvelle fonctionnalité — on incrémente le chiffre mineur
            # et on remet le patch à zéro (les corrections précédentes sont incluses).
            elif echo "$LABELS" | grep -q "^feature$"; then
              Y=$((Y + 1)); Z=0

            # fix / hotfix / chore : changement sans impact sur l'interface ou l'API
            # — on incrémente uniquement le patch.
            else
              Z=$((Z + 1))
            fi

            NEXT_TAG="v${X}.${Y}.${Z}"
          fi

          echo "NEXT_TAG=$NEXT_TAG" >> "$GITHUB_ENV"
          echo "Next tag: $NEXT_TAG"

      # Promeut la section "Non publié" du changelog en version datée, et pousse ce
      # commit AVANT la création du tag : le tag doit pointer sur un arbre dont le
      # changelog est déjà à jour, sans quoi la release décrirait un contenu absent.
      #
      # Le commit porte un marqueur de saut de CI, et le dépôt appelant doit
      # exclure son changelog du déclencheur (paths-ignore), sans quoi ce push
      # relance un run qui échouera faute de PR mergée associée.
      - name: Promote CHANGELOG section
        if: inputs.changelog-file != ''
        env:
          CHANGELOG: ${{ inputs.changelog-file }}
        run: |
          if [ ! -f "$CHANGELOG" ]; then
            echo "$CHANGELOG absent du dépôt, étape ignorée"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          sed -i "0,/^## \[Non publié\]/s//## [Non publié]\n\n## [$NEXT_TAG] - $DATE/" "$CHANGELOG"

          # Corps de la section fraîchement promue, pour les notes de release
          awk -v tag="## [$NEXT_TAG]" '
            index($0, tag) == 1 { flag = 1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' "$CHANGELOG" > /tmp/release-notes.md

          # Une version sans contenu ne trace rien. Le cas se produit quand la
          # section "Non publié" est vide au moment du merge, ou qu'un titre de
          # niveau 2 s'est glissé juste en dessous : le sed ci-dessus insère
          # alors le titre de version devant une section sans corps.
          #
          # Le test porte sur la présence d'un caractère non blanc, et non sur
          # la taille du fichier : une section vide produit un fichier d'un seul
          # saut de ligne, que "test -s" considère comme non vide. C'est
          # exactement ce qui a laissé passer une release au corps vide le
          # 2026-09-15, le repli --generate-notes n'ayant jamais été atteint.
          #
          # L'échec intervient avant le commit, le tag et la release : rien n'est
          # publié à moitié. Renseigner la section "Non publié" puis relancer.
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::error title=Section de changelog vide::La section promue $NEXT_TAG n'a aucun contenu. Vérifiez que la section \"Non publié\" de $CHANGELOG est renseignée et qu'aucun titre de niveau 2 ne la suit immédiatement, puis relancez ce workflow."
            exit 1
          fi

          git add "$CHANGELOG"
          git commit -m "docs(changelog): publie $NEXT_TAG [skip ci]"
          git push origin HEAD:main

      - name: Create git tag
        run: |
          git tag "$NEXT_TAG"
          git push origin "$NEXT_TAG"

      # Une release GitHub rend la version lisible hors du dépôt. Le corps reprend
      # la section promue du changelog, avec repli sur les notes générées par
      # GitHub si elle est vide ou si le changelog est désactivé.
      - name: Create GitHub Release
        if: inputs.create-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/release-notes.md ]; then
            gh release create "$NEXT_TAG" --title "$NEXT_TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$NEXT_TAG" --title "$NEXT_TAG" --generate-notes
          fi

      # Un tag poussé avec le GITHUB_TOKEN par défaut ne déclenche pas les workflows
      # écoutant "on.push.tags" (limitation GitHub Actions anti-boucle infinie).
      # On déclenche donc explicitement le workflow de build via l'API workflow_dispatch.
      - name: Trigger Docker build
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ${{ inputs.docker-workflow-file }}
        run: |
          gh workflow run "$WORKFLOW_FILE" --ref "$NEXT_TAG"

      # Reporte le commit de promotion vers la branche de développement. Sans ce
      # report, celle-ci conserve en section "Non publié" des entrées déjà
      # publiées, et la release suivante les republie sous un nouveau numéro.
      #
      # Cette étape est volontairement la dernière : le tag, la release et le
      # build sont déjà faits et restent valides même si le report échoue. Un
      # run rouge dont l'étape en échec porte ce nom signifie donc "release
      # publiée, report à faire à la main", et non "release ratée".
      #
      # Le report se fait par un vrai merge, jamais par recopie du contenu : git
      # doit connaître le commit de promotion comme ancêtre. Recopier le texte
      # crée deux ajouts indépendants du même titre de version, que git conserve
      # tous les deux au merge suivant, ce qui vide la section "Non publié" et
      # casse la promotion d'après.
      - name: Back-merge vers la branche de développement
        if: inputs.sync-branch != '' && inputs.changelog-file != ''
        env:
          SYNC_BRANCH: ${{ inputs.sync-branch }}
        run: |
          git fetch origin main || true

          if ! git fetch origin "$SYNC_BRANCH"; then
            echo "::warning title=Branche de développement absente::$SYNC_BRANCH n'existe pas sur origin, report ignoré."
            exit 0
          fi

          git checkout -B "$SYNC_BRANCH" "origin/$SYNC_BRANCH"

          if git merge --no-edit -m "merge: reporte la promotion de $NEXT_TAG depuis main" origin/main; then
            git push origin "$SYNC_BRANCH"
            echo "Promotion de $NEXT_TAG reportée sur $SYNC_BRANCH"
          else
            git merge --abort || true
            echo "::error title=Report en conflit::Le merge de main dans $SYNC_BRANCH est en conflit. La release $NEXT_TAG est publiée et valide : seul le report reste à faire à la main."
            exit 1
          fi
