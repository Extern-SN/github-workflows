name: Conventions de PR (self)

# Ce dépôt s'impose les conventions qu'il impose au parc, par le workflow qu'il
# donne au parc : validate-pr-labelled.yml, qui pose le label puis contrôle.
#
# Jusqu'au 2026-09-18, ce fichier composait lui-même les deux appels. La
# composition vit désormais dans la chaîne, là où tous les dépôts peuvent s'en
# servir, et ce dépôt la consomme comme n'importe quel autre.
#
# Appel en "./" et non en "$/" : zizmor recommande "$/" et GitHub la documente,
# mais actionlint 1.7.7, l'autre moitié de ci-security, la rejette comme
# invalide, et elle n'existe pas sur GitHub Enterprise Server. Les deux outils
# de la chaîne se contredisent : on garde la forme portable.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  conventions:
    name: Conventions de PR
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/validate-pr-labelled.yml  # zizmor: ignore[self-repository]
    with:
      # Ce dépôt n'a pas de branche d'intégration : la règle de nommage
      # s'applique à toutes ses PR, pas seulement à celles vers "dev".
      enforce-naming-on-base: '*'
      # Chaque PR écrit la section de la version que son merge publiera. C'est ce
      # qui dispense release-tag.yml de pousser quoi que ce soit sur main, et donc
      # ce qui met fin aux promotions manuelles imposées par la protection de
      # branche : quatre le 2026-09-18, pour deux lignes chacune.
      changelog-file: CHANGELOG.md
