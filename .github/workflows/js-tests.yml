name: JS Tests

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      install-command:
        type: string
        default: 'npm ci'
      test-command:
        type: string
        default: 'npm run test:coverage'
      coverage-type:
        description: 'How to handle coverage output: badge, codecov, none'
        type: string
        default: 'none'
      coverage-summary-path:
        description: 'Path to coverage-summary.json (Istanbul/V8 format)'
        type: string
        default: 'coverage/coverage-summary.json'
      badge-output:
        type: string
        default: 'badges/js-coverage.svg'
      badge-branch:
        description: 'Branch on which the badge is committed (default: main)'
        type: string
        default: 'main'
    secrets:
      codecov-token:
        required: false

jobs:
  js-coverage:
    name: JS Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true  # le badge de couverture est commité par git-auto-commit-action

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        env:
          # La commande passe par l'environnement plutot que par interpolation.
          # Elle reste executee telle quelle, c'est sa raison d'etre : cette entree
          # n'est ecrite que dans un fichier commite du depot appelant, donc son
          # exploitation suppose deja un acces en ecriture. Ce que env: ferme, c'est
          # la sortie du contexte de citation lors du developpement de l'expression.
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -c "$INSTALL_COMMAND"

      - name: Run tests
        env:
          # La commande passe par l'environnement plutot que par interpolation.
          # Elle reste executee telle quelle, c'est sa raison d'etre : cette entree
          # n'est ecrite que dans un fichier commite du depot appelant, donc son
          # exploitation suppose deja un acces en ecriture. Ce que env: ferme, c'est
          # la sortie du contexte de citation lors du developpement de l'expression.
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"

      - name: Generate coverage badge
        if: inputs.coverage-type == 'badge' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.badge-branch)
        env:
          # Chemins passes par l'environnement plutot que par interpolation :
          # une expression developpee dans le texte du script peut en sortir et
          # executer autre chose que ce qu'elle designe.
          COVERAGE_SUMMARY_PATH: ${{ inputs.coverage-summary-path }}
          BADGE_OUTPUT: ${{ inputs.badge-output }}
        run: |
          node -e '
          const fs = require("fs");
          const summary = JSON.parse(fs.readFileSync(process.env.COVERAGE_SUMMARY_PATH, "utf8"));
          const pct     = Number(summary.total.lines.pct || 0).toFixed(2);
          const numeric = Number(pct);
          const color   = numeric >= 90 ? "brightgreen" : (numeric >= 80 ? "green" : (numeric >= 70 ? "yellow" : (numeric >= 60 ? "orange" : "red")));
          fs.mkdirSync("badges", { recursive: true });
          const url = "https://img.shields.io/badge/js%20coverage-" + encodeURIComponent(pct + "%") + "-" + color + ".svg";
          // execFileSync et non execSync : aucun shell nest lance, les
          // metacaracteres du chemin de sortie ne peuvent donc pas etre
          // interpretes comme des commandes.
          require("child_process").execFileSync("curl", ["-sSL", url, "-o", process.env.BADGE_OUTPUT]);
          '

      - name: Commit coverage badge
        if: inputs.coverage-type == 'badge' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.badge-branch)
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d  # v7.2.0
        with:
          commit_message: 'Update JS coverage badge'
          file_pattern: ${{ inputs.badge-output }}

      - name: Upload to Codecov
        if: inputs.coverage-type == 'codecov'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4  # v7.1.0
        with:
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.codecov-token }}
