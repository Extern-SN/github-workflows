name: Self Security

# Le dépôt qui porte les workflows du parc s'audite avec son propre workflow.
#
# Déclenchement manuel pour l'instant : l'audit du 2026-09-14 relève 34 findings
# de sévérité haute sur les workflows existants de ce dépôt (21 injections de
# template, 13 actions non épinglées). Les corriger touche des workflows qui
# tournent sur tout le parc, c'est un chantier à part.
#
# À passer en "pull_request" bloquant une fois ce chantier terminé, sur le
# modèle recommandé aux dépôts consommateurs :
#
#   on:
#     pull_request:
#       paths: ['.github/workflows/**', 'zizmor.yml']

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/ci-security.yml
