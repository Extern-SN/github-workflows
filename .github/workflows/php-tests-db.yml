name: PHP Tests (with database)

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        required: true
      extensions:
        type: string
        default: 'mbstring, intl, xml, dom, curl, zip'
      install-command:
        type: string
        default: 'composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader'
      bootstrap-command:
        description: 'Command to run before tests (migrations, fixtures, ...)'
        type: string
        default: ''
      test-command:
        type: string
        required: true
      db-image:
        description: 'Database Docker image (mysql:8.4, postgres:16, ...)'
        type: string
        required: true
      db-name:
        type: string
        default: 'test_db'
      db-root-password:
        type: string
        default: 'test'
      database-url:
        description: 'DATABASE_URL env var passed to bootstrap and test commands'
        type: string
        required: true
      coverage-type:
        description: 'How to handle coverage output: badge, none'
        type: string
        default: 'none'
      coverage-xml-path:
        type: string
        default: 'coverage.xml'
      badge-output:
        type: string
        default: 'badges/php-coverage.svg'
      badge-branch:
        description: 'Branch on which the badge is committed (default: main)'
        type: string
        default: 'main'
jobs:
  phpunit:
    name: PHPUnit (db)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      database:
        # L'image du service est choisie par le dépôt appelant (db-image) : ce
        # workflow ne peut pas l'épingler par digest sans lui imposer une
        # version de base de données. L'épinglage relève donc de l'appelant,
        # qui passe la valeur, et non de la chaîne mutualisée.
        image: ${{ inputs.db-image }}  # zizmor: ignore[unpinned-images]
        env:
          MYSQL_ROOT_PASSWORD: ${{ inputs.db-root-password }}
          MYSQL_DATABASE: ${{ inputs.db-name }}
          POSTGRES_PASSWORD: ${{ inputs.db-root-password }}
          POSTGRES_DB: ${{ inputs.db-name }}
        options: >-
          --health-cmd="mysqladmin ping || pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true  # le badge de couverture est commité par git-auto-commit-action

      # pcov plutôt que xdebug : couverture de lignes suffisante pour les badges,
      # nettement plus rapide. Désactivé quand aucune couverture n'est demandée
      # (un driver de couverture actif ralentit PHPUnit même sans collecte).
      - name: Setup PHP ${{ inputs.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          coverage: ${{ inputs.coverage-type == 'none' && 'none' || 'pcov' }}
          tools: composer:v2

      # actions/cache ne fait pas d'expansion shell : le chemin doit être calculé
      # dans un step préalable, pas écrit en $(...) dans le paramètre path.
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-php${{ inputs.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-php${{ inputs.php-version }}-

      - name: Install dependencies
        env:
          # La commande passe par l'environnement plutot que par interpolation.
          # Elle reste executee telle quelle, c'est sa raison d'etre : cette entree
          # n'est ecrite que dans un fichier commite du depot appelant, donc son
          # exploitation suppose deja un acces en ecriture. Ce que env: ferme, c'est
          # la sortie du contexte de citation lors du developpement de l'expression.
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -c "$INSTALL_COMMAND"

      - name: Bootstrap test environment
        if: inputs.bootstrap-command != ''
        env:
          DATABASE_URL: ${{ inputs.database-url }}
          APP_ENV: test
          # La commande passe par l'environnement plutot que par interpolation.
          # Elle reste executee telle quelle, c'est sa raison d'etre : cette entree
          # n'est ecrite que dans un fichier commite du depot appelant, donc son
          # exploitation suppose deja un acces en ecriture. Ce que env: ferme, c'est
          # la sortie du contexte de citation lors du developpement de l'expression.
          BOOTSTRAP_COMMAND: ${{ inputs.bootstrap-command }}
        run: bash -c "$BOOTSTRAP_COMMAND"

      - name: Run tests
        env:
          DATABASE_URL: ${{ inputs.database-url }}
          APP_ENV: test
          # La commande passe par l'environnement plutot que par interpolation.
          # Elle reste executee telle quelle, c'est sa raison d'etre : cette entree
          # n'est ecrite que dans un fichier commite du depot appelant, donc son
          # exploitation suppose deja un acces en ecriture. Ce que env: ferme, c'est
          # la sortie du contexte de citation lors du developpement de l'expression.
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"

      - name: Generate coverage badge
        if: inputs.coverage-type == 'badge' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.badge-branch)
        env:
          # Chemins passes par l'environnement plutot que par interpolation :
          # une expression developpee dans le texte du script PHP peut en sortir
          # et executer autre chose que ce qu'elle designe.
          COVERAGE_XML_PATH: ${{ inputs.coverage-xml-path }}
          BADGE_OUTPUT: ${{ inputs.badge-output }}
        run: |
          php -r '
          $xml = simplexml_load_file(getenv("COVERAGE_XML_PATH"));
          $metrics = $xml->project->metrics;
          $covered = (int) $metrics["coveredstatements"];
          $total   = (int) $metrics["statements"];
          $percent = $total > 0 ? round(($covered / $total) * 100, 2) : 0;
          $color   = $percent >= 90 ? "brightgreen" : ($percent >= 80 ? "green" : ($percent >= 70 ? "yellow" : ($percent >= 60 ? "orange" : "red")));
          @mkdir("badges", 0777, true);
          $svg = file_get_contents("https://img.shields.io/badge/php%20coverage-" . rawurlencode($percent . "%") . "-" . $color . ".svg");
          file_put_contents(getenv("BADGE_OUTPUT"), $svg);
          '

      - name: Commit coverage badge
        if: inputs.coverage-type == 'badge' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.badge-branch)
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d  # v7.2.0
        with:
          commit_message: 'Update PHP coverage badge'
          file_pattern: ${{ inputs.badge-output }}

