name: Python Tests

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Labels du runner au format JSON, par exemple ["self-hosted","linux"],
          ou une chaîne JSON pour un runner unique : "ubuntu-22.04".
          Ne pas la passer : le défaut lit la variable d'organisation
          CI_RUNNER_LABELS, point unique de bascule du parc (README, section
          "Choix du runner"), et se rabat sur le runner self-hosted du Groupe
          si elle est absente. La passer court-circuite cette variable.
        type: string
        required: false
        default: ${{ vars.CI_RUNNER_LABELS || '["self-hosted","Linux","X64","ovh-ppr"]' }}
      python-version:
        type: string
        default: '3.12'
      install-command:
        type: string
        default: 'pip install -e .[dev]'
      lint-command:
        description: 'Lint command (ruff, flake8, ... — skipped if empty)'
        type: string
        default: ''
      test-command:
        type: string
        default: 'pytest -q'
      cache-dependency-path:
        description: 'Glob of files whose hash keys the pip cache (pyproject.toml, requirements*.txt, ...)'
        type: string
        default: '**/pyproject.toml'

jobs:
  pytest:
    name: Python Tests
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # aucun push : le jeton n'a rien à faire dans le checkout

      # Le cache pip est géré nativement par setup-python : il est invalidé quand
      # le fichier de dépendances (cache-dependency-path) change. Le glob doit
      # matcher au moins un fichier du dépôt, sinon le step échoue.
      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Install dependencies
        env:
          # La commande passe par l'environnement plutot que par interpolation.
          # Elle reste executee telle quelle, c'est sa raison d'etre : cette entree
          # n'est ecrite que dans un fichier commite du depot appelant, donc son
          # exploitation suppose deja un acces en ecriture. Ce que env: ferme, c'est
          # la sortie du contexte de citation lors du developpement de l'expression.
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -c "$INSTALL_COMMAND"

      - name: Lint
        if: inputs.lint-command != ''
        env:
          # La commande passe par l'environnement plutot que par interpolation.
          # Elle reste executee telle quelle, c'est sa raison d'etre : cette entree
          # n'est ecrite que dans un fichier commite du depot appelant, donc son
          # exploitation suppose deja un acces en ecriture. Ce que env: ferme, c'est
          # la sortie du contexte de citation lors du developpement de l'expression.
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: bash -c "$LINT_COMMAND"

      - name: Run tests
        env:
          # La commande passe par l'environnement plutot que par interpolation.
          # Elle reste executee telle quelle, c'est sa raison d'etre : cette entree
          # n'est ecrite que dans un fichier commite du depot appelant, donc son
          # exploitation suppose deja un acces en ecriture. Ce que env: ferme, c'est
          # la sortie du contexte de citation lors du developpement de l'expression.
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"
