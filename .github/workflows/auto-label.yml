name: Auto Label PR

# Pose automatiquement le label de release dès l'ouverture d'une PR.
#
# Deux sources, dans cet ordre :
#
#   1. le préfixe du nom de branche (feature/, fix/, hotfix/) ;
#   2. pour une PR d'intégration (dev vers main), les labels des PR qu'elle
#      transporte, dont on retient le plus fort.
#
# La seconde source existe parce qu'une branche d'intégration s'appelle "dev" et
# ne dit donc rien de son contenu : sans elle, toute PR dev vers main échoue au
# contrôle des conventions, et release-tag.yml se rabat sur un incrément de
# correctif. Les PR transportées, elles, sont toutes labellisées : c'est la
# règle. L'information existe déjà, il suffit de la lire.
#
# Les labels "chore" et "breaking" ne se déduisent pas d'un nom de branche et
# restent manuels sur une PR ordinaire.
#
# Une PR d'intégration s'enrichit après son ouverture : les PR qu'elle transporte
# sont fusionnées dans la branche pendant qu'elle reste ouverte. Déduire son label
# au seul événement "opened" revient donc à le lire au moment où elle est vide.
# D'où le déclenchement sur "synchronize", et la règle qui relève le label déjà
# posé quand une PR plus forte arrive ensuite. Le label ne redescend jamais : un
# "breaking" mis à la main survit à une intégration qui ne porte que des correctifs.
#
# Le dépôt appelant garde le déclencheur, un workflow réutilisable ne pouvant
# pas définir son propre "on". Appel type :
#
#   on:
#     pull_request:
#       types: [opened, reopened, synchronize]
#
#   jobs:
#     label:
#       permissions:
#         contents: read        # obligatoire : voir ci-dessous
#         pull-requests: write
#       uses: Extern-SN/github-workflows/.github/workflows/auto-label.yml@v1
#
# Les deux permissions sont nécessaires. Un bloc "permissions" sur le job met à
# "none" tout ce qu'il ne nomme pas, et ce workflow exige "contents: read" pour
# se charger. Un appelant qui n'accorde que "pull-requests: write" échoue au
# démarrage, sans aucun job créé et sans log : "The workflow is requesting
# 'contents: read', but is only allowed 'contents: none'".

on:
  workflow_call:
    inputs:
      prefix-map:
        description: >
          Correspondance préfixe de branche vers label, au format JSON.
          La valeur par défaut couvre la convention du Groupe.
        type: string
        default: '{"feature/": "feature", "fix/": "fix", "hotfix/": "hotfix"}'
      integration-branch:
        description: >
          Branche d'intégration dont le label se déduit des PR transportées.
          Laisser vide désactive ce comportement.
        type: string
        default: 'dev'
      label-ranking:
        description: >
          Labels de version du plus fort au plus faible, au format JSON.
          L'ordre décide de l'incrément retenu quand une intégration transporte
          des PR de natures différentes : une seule "feature" parmi dix "fix"
          impose un incrément mineur, sans quoi la fonctionnalité sortirait
          sous un numéro de correctif.
        type: string
        default: '["breaking", "feature", "fix", "hotfix", "chore"]'

permissions:
  contents: read

jobs:
  label:
    name: Pose du label de release
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write  # nécessaire pour ajouter un label sur la PR

    steps:
      - name: Apply release label
        uses: actions/github-script@v9
        env:
          PREFIX_MAP: ${{ inputs.prefix-map }}
          INTEGRATION_BRANCH: ${{ inputs.integration-branch }}
          LABEL_RANKING: ${{ inputs.label-ranking }}
        with:
          script: |
            // Toutes les entrées viennent de l'environnement et ne sont jamais
            // interpolées dans le corps du script : une valeur hostile ne peut
            // pas s'exécuter ici.
            const parse = (nom, brut) => {
              try {
                return JSON.parse(brut);
              } catch (e) {
                core.setFailed(`${nom} n'est pas un JSON valide : ${e.message}`);
                return null;
              }
            };

            const map = parse('prefix-map', process.env.PREFIX_MAP);
            if (map === null) return;
            const ranking = parse('label-ranking', process.env.LABEL_RANKING);
            if (ranking === null) return;

            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const integration = process.env.INTEGRATION_BRANCH;

            const poser = async (label, origine) => {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [label],
              });
              console.log(`Label "${label}" posé (${origine}).`);
              await core.summary
                .addRaw(`Label de release **${label}** posé : ${origine}.`)
                .write();
            };

            // Labels de version déjà posés. On les relit par l'API plutôt que de
            // se fier à la charge utile de l'événement : sur "synchronize" celle-ci
            // peut décrire un état antérieur de la PR.
            const actuels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const deja = actuels.map(l => l.name).filter(n => ranking.includes(n));

            const force = l => ranking.indexOf(l);  // 0 est le plus fort
            const plusFort = liste => liste.reduce((a, b) => (force(b) < force(a) ? b : a));

            const retirer = async (label) => {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label,
                });
                console.log(`Label "${label}" retiré.`);
              } catch (e) {
                // Déjà retiré entre-temps : sans intérêt, on continue.
                if (e.status !== 404) throw e;
              }
            };

            // 1. PR d'intégration : son nom de branche ne dit rien, les PR qu'elle
            // transporte si. Ce cas passe avant le garde-fou sur les labels déjà
            // posés, parce qu'une intégration continue de s'enrichir après son
            // ouverture : un label déduit trop tôt doit pouvoir être relevé.
            if (integration && branch === integration) {
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });

              // Deux formes selon le mode de fusion : commit de merge, ou titre
              // suffixé du numéro quand la PR a été écrasée (squash).
              const numeros = new Set();
              for (const c of commits) {
                const titre = c.commit.message.split('\n')[0];
                const merge = titre.match(/^Merge pull request #(\d+)\b/);
                if (merge) { numeros.add(Number(merge[1])); continue; }
                const squash = titre.match(/\(#(\d+)\)\s*$/);
                if (squash) { numeros.add(Number(squash[1])); }
              }
              numeros.delete(pr.number);

              const trouves = new Set();
              for (const n of numeros) {
                try {
                  const { data } = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: n,
                  });
                  for (const l of data.labels) {
                    if (ranking.includes(l.name)) trouves.add(l.name);
                  }
                } catch (e) {
                  // Un numéro cité dans un message de commit sans être une PR de
                  // ce dépôt : on l'ignore plutôt que d'échouer.
                  console.log(`#${n} illisible (${e.status}), ignoré.`);
                }
              }

              const liste = [...numeros].sort((a, b) => a - b).map(n => `#${n}`).join(', ');
              const retenu = ranking.find(l => trouves.has(l));

              if (!retenu) {
                if (deja.length > 0) {
                  console.log(`Aucun label transporté lisible, la PR garde "${deja[0]}".`);
                  return;
                }
                core.warning(
                  `Intégration "${branch}" : aucune des PR transportées ne porte de ` +
                  `label de version. Posez-en un à la main, sinon le contrôle des ` +
                  `conventions bloquera la fusion.`
                );
                return;
              }

              if (deja.length === 0) {
                await poser(retenu, `plus fort label des PR transportées (${liste})`);
                return;
              }

              // Le label posé ne redescend jamais : un "breaking" mis à la main
              // survit à une intégration qui ne transporte que des correctifs.
              const enPlace = plusFort(deja);
              const garde = force(retenu) < force(enPlace) ? retenu : enPlace;

              if (garde === enPlace && deja.length === 1) {
                console.log(`La PR porte déjà "${enPlace}", au moins aussi fort que "${retenu}".`);
                return;
              }

              for (const l of deja) {
                if (l !== garde) await retirer(l);
              }
              if (!deja.includes(garde)) {
                await poser(garde, `relevé depuis "${enPlace}" par les PR transportées (${liste})`);
              } else {
                console.log(`Labels de version surnuméraires retirés, "${garde}" conservé.`);
              }
              return;
            }

            // 2. Garde-fou : validate-pr.yml exige EXACTEMENT un label de version.
            // En poser un second sur une PR qui en porte déjà un ferait échouer le
            // contrôle au lieu de le satisfaire.
            if (deja.length > 0) {
              console.log(`La PR porte déjà le label de version "${deja[0]}", rien à faire.`);
              return;
            }

            // 3. Cas courant : le nom de branche porte l'information.
            const parPrefixe = Object.entries(map).find(([p]) => branch.startsWith(p))?.[1];
            if (parPrefixe) {
              await poser(parPrefixe, `déduit du préfixe de la branche "${branch}"`);
              return;
            }

            // 4. Branche non reconnue : "chore" et "breaking" restent manuels.
            // Pas d'échec ici, validate-pr.yml bloquera la fusion avec un
            // message explicite tant qu'aucun label n'est posé.
            console.log(`Aucun label déduit pour "${branch}", posez "chore" ou "breaking" à la main.`);
